[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "koszt-remontu"
version = "0.1.0"
description = "Kalkulator kosztu remontu z obsługą usług i wyceny dojazdu"
authors = [{name = "Generated by ChatGPT"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.37"]

[project.scripts]
koszt-remontu = "koszt_remontu.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["koszt_remontu*"]
